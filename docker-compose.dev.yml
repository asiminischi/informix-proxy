# Development compose - sources configuration from .env (see .env.example)

services:
  # Informix gRPC Proxy (built from this project)
  informix-proxy-dev:
    build: .
    container_name: informix-grpc-proxy-dev
    ports:
      - "${GRPC_PORT:-50051}:50051"
      - "${METRICS_PORT:-9090}:9090"
    environment:
      - GRPC_PORT=${GRPC_PORT:-50051}
      - METRICS_PORT=${METRICS_PORT:-9090}
      - JAVA_OPTS=${JAVA_OPTS:--Xmx512m -Xms256m}
      # No Informix host/credentials here on purpose: the proxy is
      # database-agnostic. Each client supplies host/port/database/username/
      # password itself in the Connect RPC, so the proxy never needs to hold
      # database credentials. See informix-db-dev below for the local test
      # database's own admin credentials, which are unrelated to the proxy.
      - POOL_MAX_SIZE=${POOL_MAX_SIZE:-10}
      - POOL_MIN_IDLE=${POOL_MIN_IDLE:-2}
      - POOL_CONNECTION_TIMEOUT_MS=${POOL_CONNECTION_TIMEOUT_MS:-30000}
      - POOL_IDLE_TIMEOUT_MS=${POOL_IDLE_TIMEOUT_MS:-600000}
      - POOL_MAX_LIFETIME_MS=${POOL_MAX_LIFETIME_MS:-1800000}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - informix-network-dev

  # Optional local Informix developer DB for testing
  informix-db-dev:
    image: ibmcom/informix-developer-database:latest
    container_name: informix-db-dev
    privileged: true
    environment:
      - LICENSE=accept
      - SIZE=small
      - INFORMIXSERVER=${INFORMIX_SERVER:-informix}
      - DB_NAME=${INFORMIX_DB:-testdb}
    ports:
      - "9088:9088"
      - "9089:9089"
    volumes:
      - informix-data-dev:/opt/ibm/data
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - informix-network-dev

networks:
  informix-network-dev:
    driver: bridge

volumes:
  informix-data-dev:
