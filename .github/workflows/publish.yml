name: Build & Publish — informix-proxy

on:
  push:
    branches: [master]
    paths:
      # Only rebuild when something that affects the image changes
      - "src/**"
      - "Dockerfile"
      - "pom.xml"
      - ".github/workflows/publish.yml"
  # Allow manual trigger for emergency rebuilds
  workflow_dispatch:
    inputs:
      push:
        description: "Push image to GHCR?"
        type: boolean
        default: true

concurrency:
  group: informix-proxy-build
  cancel-in-progress: true   # A new push supersedes an in-progress build

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # asiminischi/informix-proxy

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Required for signing the image with Cosign
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Set up QEMU for multi-platform builds (linux/amd64 + linux/arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # Immutable SHA tag — what docker-compose.yml should pin to
            type=sha,format=short
            # Semver tags if you push a git tag like v1.2.3
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # Mutable latest tag on master
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=informix-proxy
            org.opencontainers.image.description=Production-grade gRPC proxy for Informix databases
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub Actions cache backend — speeds up repeated builds significantly
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Supply-chain: generate SBOM and provenance attestations
          provenance: true
          sbom: true

      # Install Cosign for image signing
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      # Sign the image digest with keyless signing (Sigstore/Fulcio)
      # This ties the image to this specific GitHub Actions run — verifiable by anyone
      - name: Sign image
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push }}
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          echo "${TAGS}" | xargs -I {} cosign sign --yes \
            "{}@${DIGEST}"

      - name: Summary
        run: |
          echo "### 🐳 informix-proxy image published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Digest** | \`${{ steps.build.outputs.digest }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Platforms** | \`linux/amd64\`, \`linux/arm64\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tags pushed:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pin this exact build in docker-compose.yml:**" >> $GITHUB_STEP_SUMMARY
          echo '```yaml' >> $GITHUB_STEP_SUMMARY
          echo "image: ghcr.io/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY